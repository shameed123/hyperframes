<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Keep Microphones Muted</title>
  <link href="./css2" rel="stylesheet">
  <link rel="stylesheet" href="./theme.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
  </style>
</head>

<body>
  <div class="slide-container" data-screen-label="Microphones Muted"
    style="position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);">
    <div data-object="true" data-object-type="textbox" class="pure-ai-copyright-top" style="position:absolute;left:1480px;top:16px;width:345px;height:24px;z-index:31;text-align:center;font-family:&#39;JetBrains Mono&#39;,monospace;font-size:13px;line-height:1.2;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);">Copyright 2026</div>
<img data-object="true" data-object-type="image" class="pure-ai-logo" src="./purelogo-name-transparent.png" alt="Pure AI Solutions logo" style="position:absolute;left:1470px;top:23px;width:345px;height:auto;z-index:30;display:block;">
    <div data-object="true" data-object-type="textbox" class="pure-ai-copyright-bottom" style="position:absolute;left:1485px;top:80px;width:345px;height:24px;z-index:31;text-align:center;font-family:&#39;JetBrains Mono&#39;,monospace;font-size:13px;line-height:1.2;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);">All rights reserved</div>

    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:-220px;top:-260px;width:860px;height:860px;border-radius:50%;background:radial-gradient(circle at 50% 50%, #DBEAFE 0%, rgba(219,234,254,0) 64%);z-index:1;">
    </div>
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:1180px;top:540px;width:880px;height:880px;border-radius:50%;background:radial-gradient(circle at 50% 50%, #FCE7F3 0%, rgba(252,231,243,0) 62%);z-index:1;">
    </div>

    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:690px;top:150px;width:540px;height:210px;border-radius:38px;background:white;border:1.5px solid var(--line);box-shadow:var(--shadow-md);z-index:5;">
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:760px;top:195px;width:400px;height:120px;z-index:10;text-align:center;color:var(--pink-2);">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 5.1 2.1"/><path d="M15 9.3V5a3 3 0 0 0-4.7-2.5"/><path d="M19 10v1a7 7 0 0 1-10.6 6"/><path d="M5 10v1a7 7 0 0 0 7 7"/><path d="M12 18v4"/><path d="M8 22h8"/><path d="m2 2 20 20"/></svg>
    </div>

    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:250px;top:430px;width:1420px;height:260px;z-index:10;text-align:center;">
      <div
        style="font-family:&#39;Instrument Serif&#39;,serif;font-size:86px;line-height:1.02;letter-spacing:-0.012em;color:var(--muted);">
        Keep your microphone muted at all times unless you have a question.
      </div>
    </div>

    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:330px;top:760px;width:560px;height:130px;border-radius:28px;background:var(--blue-soft);border:1.5px solid var(--line);box-shadow:var(--shadow-sm);z-index:5;">
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:385px;top:795px;width:450px;height:60px;z-index:10;display:flex;align-items:center;gap:22px;color:var(--blue-2);">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 5.1 2.1"/><path d="M15 9.3V5a3 3 0 0 0-4.7-2.5"/><path d="M19 10v1a7 7 0 0 1-10.6 6"/><path d="M5 10v1a7 7 0 0 0 7 7"/><path d="M12 18v4"/><path d="M8 22h8"/><path d="m2 2 20 20"/></svg>
      <span style="font-size:30px;line-height:1.2;">Mute by default</span>
    </div>

    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:1030px;top:760px;width:560px;height:130px;border-radius:28px;background:var(--pink-soft);border:1.5px solid var(--line);box-shadow:var(--shadow-sm);z-index:5;">
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:1085px;top:795px;width:450px;height:60px;z-index:10;display:flex;align-items:center;gap:22px;color:var(--pink-2);">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
      <span style="font-size:30px;line-height:1.2;">Unmute to ask questions</span>
    </div>
  </div>
  <script src="./slide-inner.js.download"></script>
</body>

</html>
